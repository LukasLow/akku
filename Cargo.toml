[workspace]
members = [
    "crates/akku",
    "crates/akku-drive",
    "crates/akku-cli",
    "examples/hello",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/LukasLow/akku"
homepage = "https://github.com/LukasLow/akku"

[workspace.dependencies]
akku = { path = "crates/akku", version = "0.0.1" }
akku-drive = { path = "crates/akku-drive", version = "0.0.1" }
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
