changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '* {{.Body}}'
# Release guard: akku stays on 0.0.x until at least 2027-Q2, so every kind
# bumps patch and there is no per-fragment version override. Releases always
# pass an explicit 0.0.N to .github/scripts/release.py (see RELEASE_SERIES).
kinds:
  - label: Added
    auto: patch
  - label: Changed
    auto: patch
  - label: Deprecated
    auto: patch
  - label: Removed
    auto: patch
  - label: Fixed
    auto: patch
  - label: Security
    auto: patch
newlines:
  afterChangelogHeader: 1
  beforeChangelogVersion: 1
  endOfVersion: 1
