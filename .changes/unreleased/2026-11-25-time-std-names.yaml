kind: Changed
body: "**Breaking:** `akku::time::Duration` is renamed to `akku::time::SignedDuration` (after jiff) and the mockable clock reading `akku::time::Instant` to `akku::time::ClockInstant`; `akku::time::{Duration, Instant}` are now `std::time`'s exact items, re-exported by explicit list together with `SystemTime`, `SystemTimeError`, `TryFromFloatSecsError`, and `UNIX_EPOCH`. New conversions: `SignedDuration` <-> `std::time::Duration` (`TryFrom` both ways, rejecting negatives and overflow), `std::time::Instant` -> `ClockInstant` (`From`) and back (`TryFrom`, rejecting `MockClock` readings with the new `TimeError::MockInstant`), and `OffsetDateTime` <-> `SystemTime` (`TryFrom`). `akku::env::home_dir` is now a re-export of `std::env::home_dir` instead of akku's own function (an empty `HOME` no longer yields `None`: std returns `Some(\"\")` on Rust 1.85 and falls back to the OS user lookup on newer toolchains; it carries std's deprecation warning on Rust < 1.87), and `akku::env`, `akku::fs`, and `akku::process` add the missing stable std re-exports (`env::{consts, Args, ArgsOs, JoinPathsError, SplitPaths, VarError, Vars, VarsOs}`, `fs::{exists, DirBuilder, FileTimes}`, `process::{abort, CommandArgs, CommandEnvs, Termination}`)."
time: 2026-11-25T00:00:00Z
