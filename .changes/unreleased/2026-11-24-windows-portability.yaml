kind: Fixed
body: "Windows: `fs::glob` now accepts drive/UNC prefixes and `\\` separators (e.g. `C:\\logs\\*.txt`), and archive extraction rejects path components Windows would reinterpret (`:` drive prefixes and alternate data streams, reserved device names like `CON`/`NUL`/`COM1`, trailing dots or spaces), closing a zip-slip escape via entries like `a/C:evil`. Unix behaviour is unchanged."
