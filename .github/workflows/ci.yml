name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Required by branch protection: keep the job name `test`.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so check-changes.sh can diff against the PR base.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test -p akku --no-default-features --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Module catalog is up to date
        run: cargo run --locked -p akku-cli -- catalog check
      - name: unsafe allowlist
        run: sh .github/scripts/check-unsafe.sh
      - name: Release guard (0.0.x only) and release state
        run: python3 .github/scripts/release.py --check

      - name: Check changie fragment added by this PR
        if: >-
          github.event_name == 'pull_request' &&
          github.actor != 'dependabot[bot]' &&
          !startsWith(github.head_ref, 'release/') &&
          !startsWith(github.head_ref, 'dependabot/') &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
          !contains(github.event.pull_request.labels.*.name, 'release') &&
          !contains(github.event.pull_request.labels.*.name, 'dependencies')
        run: sh .github/scripts/check-changes.sh

  # Optional by design (native first), never make required.
  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p akku --no-default-features --target wasm32-unknown-unknown --locked

  # Required by branch protection: keep the job names `os-test (macos-latest)` and `os-test (windows-latest)`.
  os-test:
    name: os-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF line endings (test fixtures)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  # Optional for now; verifies the declared MSRV (1.85) against rust-toolchain.toml's stable default.
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets --locked
