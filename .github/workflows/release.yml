name: release

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      CARGO_INCREMENTAL: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      - name: Read the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="akku") | .version' \
            | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "release version: $version"

      - name: Skip when the tag already exists
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; nothing to publish"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Skip when the version is already published
        if: env.SKIP != '1'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "User-Agent: akku-release-ci (https://github.com/LukasLow/akku)" \
            "https://crates.io/api/v1/crates/akku/$VERSION")
          if [ "$code" = "200" ]; then
            echo "akku $VERSION is already published; nothing to publish"
            echo "SKIP=1" >> "$GITHUB_ENV"
          elif [ "$code" != "404" ]; then
            echo "crates.io returned $code for akku $VERSION"
            exit 1
          fi

      - name: Check that a release is prepared
        if: env.SKIP != '1'
        run: |
          if ! grep -q "^## $VERSION -" CHANGELOG.md; then
            echo "no CHANGELOG section for $VERSION; Cargo.toml change is not a release"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          notes=$(ls releases/v"$VERSION"-*.md 2>/dev/null | head -1 || true)
          if [ -z "$notes" ]; then
            echo "missing releases/v$VERSION-*.md"
            exit 1
          fi
          if ls .changes/unreleased/*.yaml >/dev/null 2>&1; then
            echo "unreleased changie fragments remain; run changie batch/merge"
            exit 1
          fi
          echo "NOTES=$notes" >> "$GITHUB_ENV"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.SKIP != '1'

      - name: Publish
        if: env.SKIP != '1'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          publish() {
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "User-Agent: akku-release-ci (https://github.com/LukasLow/akku)" \
              "https://crates.io/api/v1/crates/$1/$VERSION")
            if [ "$code" = "200" ]; then
              echo "$1 $VERSION is already published"
              return 0
            fi
            if [ "$code" != "404" ]; then
              echo "crates.io returned $code for $1 $VERSION"
              return 1
            fi
            cargo publish --locked -p "$1"
          }
          publish akku-drive
          sleep 30
          publish akku
          sleep 10
          publish akku-cli

      - name: GitHub release and tag
        if: env.SKIP != '1'
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "akku $VERSION" \
            --notes-file "$NOTES"
